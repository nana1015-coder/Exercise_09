<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Exercise 09</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #d9d9d9;
padding: 20px;
}

.box {
font-size: 28px;
font-weight: bold;
padding: 8px 12px;
margin: 14px 0;
}

/* 第一列：淺藍底 + 紅色雙線邊框 + 微圓角 */
.box1 {
background-color: #add8e6;
border: 4px double #e05a47;
border-radius: 6px;
}

/* 第二列：黃底 + 深色實線邊框 + 微圓角 */
.box2 {
background-color: #ffff00;
border: 3px solid #222222;
border-radius: 8px;
}

/* 第三列：綠底 + 淺色點狀/虛線邊框 */
.box3 {
background-color: #28a745;
border: 3px dotted #d3d3d3;
border-radius: 4px;
}
</style>
</head>
<body>

<p class="box box1">Hello World</p>
<p class="box box2">Hello World</p>
<p class="box box3">Hello World</p>

</body>
</html>
